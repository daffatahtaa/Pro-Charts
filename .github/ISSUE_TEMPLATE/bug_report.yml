name: Bug Report
description: Report a bug in Pro-Charts (MT5 bridge, Pine Script v6 engine, Bar Replay, drawings, or UI)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please include enough detail so we can reproduce and fix it quickly.
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Live MetaTrader 5 / Order Execution
        - Pine Script v4/v5/v6 Engine
        - Bar Replay / Paper Trading
        - Drawing Tools / Overlays
        - Multi-Chart Layout / UI
        - Trading Journal / Backtest Analytics
        - Backend API / DuckDB Cache
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open XAUUSD on H1 timeframe
        2. Apply indicator or draw tool '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS: Windows 11
        - Python / Node versions:
        - MT5 Mode: Live / Demo / Simulated Mock
        - Browser: Chrome / Edge / Firefox
  - type: textarea
    id: pine_code
    attributes:
      label: Pine Script Snippet or Console Logs (Optional)
      render: text
